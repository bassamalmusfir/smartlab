name: smartlab
description: "AI-powered lab result analysis app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  go_router: ^18.0.2
  dio: ^5.11.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_storage: ^13.6.0
  cloud_firestore: ^6.10.0
  file_picker: ^13.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # assets/fonts entries removed: no files exist under assets/ yet, and
  # flutter run/build fails asset resolution for paths that don't exist.
  # Re-add once assets/images/ and assets/fonts/Poppins-*.ttf are present.
  # theme.dart still requests fontFamily: 'Poppins' — Flutter falls back to
  # the platform default font until the Poppins files are added back here.
